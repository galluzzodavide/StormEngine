<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StormEngine — Live Ships + Weather (Upper Adriatic)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.92);
        --glass-brd: rgba(15, 23, 42, 0.12);
        --muted: #64748b;
      }
      html, body, #map { height: 100%; margin: 0; }
      .panel {
        position: absolute; z-index: 1000;
        background: var(--glass-bg);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        border: 1px solid var(--glass-brd);
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(2, 6, 23, 0.15);
      }
      .panel h3 { margin: 0 0 6px; font: 600 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .section + .section { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(15,23,42,0.15); }
      .muted { color: var(--muted); font-size: 12px; }
      label { font: 500 12px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#0f172a; }
      input[type="text"] {
        border: 1px solid #e2e8f0; border-radius: 10px; padding: 6px 8px;
        font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; width: 160px;
      }
      button {
        border-radius: 10px; border: 1px solid #0f172a; background: #0f172a; color: #fff;
        padding: 6px 10px; font: 600 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; cursor: pointer;
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .row.spread { justify-content: space-between; }
      .grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
      .legend { font: 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#0f172a; }
      .chip { display:inline-block; padding:2px 6px; border-radius:999px; background:#f1f5f9; font-size:11px; color:#0f172a; }
      .segmented { display:flex; gap:6px; }
      .segmented label { display:flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid #e2e8f0; border-radius:10px; cursor:pointer; }
      .segmented input[type="radio"] { accent-color:#0f172a; }
      input[type="range"] { width: 180px; }
      .badge {
        position:absolute; right:12px; bottom:12px; background:rgba(15,23,42,0.85); color:#fff;
        font:600 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        padding:6px 10px; border-radius:999px; letter-spacing: .2px;
      }
    </style>
  </head>
  <body>
    <!-- Left panel (AIS + Weather + Basemap) -->
    <div class="panel" style="top:12px; left:12px; padding:12px; width: 420px;">
      <div class="row spread" style="margin-bottom:6px">
        <h3>StormEngine — Upper Adriatic</h3>
        <span class="muted">v0.2</span>
      </div>

      <div class="section">
        <label style="display:block;margin-bottom:4px">Basemap</label>
        <div class="segmented">
          <label><input type="radio" name="base" id="baseOSM" /> OSM</label>
          <label><input type="radio" name="base" id="baseSAT" checked /> Satellite</label>
          <label><input type="radio" name="base" id="baseBING" /> Bing</label>
        </div>
      </div>

      <div class="section grid">
        <label>Ship (MMSI)</label>
        <div class="row">
          <input type="text" id="mmsiInput" placeholder="e.g., 247123456" />
          <button id="selectShipBtn" title="Follow ship">Follow</button>
        </div>

        <label>Hour (forecast)</label>
        <div class="row">
          <input id="omHour" type="range" min="0" max="71" value="0" step="1" />
          <span id="omHourLabel" class="muted" style="width:120px;text-align:right">—</span>
        </div>

        <label>Point opacity</label>
        <div class="row">
          <input id="omOpacity" type="range" min="0" max="1" step="0.05" value="0.95" />
          <span id="omOpacityVal" class="muted">0.95</span>
        </div>

        <label>Point scale</label>
        <div class="row">
          <input id="omSizeBoost" type="range" min="0.8" max="3.0" step="0.1" value="1.6" />
          <span id="omSizeBoostVal" class="muted">1.6×</span>
        </div>

        <label>Animation</label>
        <div class="row">
          <label><input type="checkbox" id="omAutoplay" /> Auto-play</label>
        </div>

        <label>Event layers</label>
        <div class="row" style="gap:16px">
          <label><input type="checkbox" id="toggleStorms" checked /> Thunderstorms</label>
          <label><input type="checkbox" id="toggleExtreme" checked /> Extreme events</label>
        </div>

        <div class="row spread" style="grid-column:1 / -1; margin-top:4px">
          <div id="omStatus" class="muted">loading…</div>
          <div class="chip">Area 45–46N · 12–14E</div>
        </div>
      </div>
    </div>

    <div id="map"></div>
    <div class="badge">Leaflet Pro UI</div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
